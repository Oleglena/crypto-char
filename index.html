<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0e11">
<title>Secure Contacts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root { --bg:#0b0e11; --panel:#151921; --panel2:#20262d; --panel3:#2a3038; --accent:#00a884; --text:#e9edef; --text-dim:#8696a0; --border:#30363d; --bubble-in:#202c33; --bubble-out:#005c4b; }
* { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; height: 100dvh; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; }
.container { width:100%; max-width:520px; background:var(--panel); display:flex; flex-direction:column; position:relative; overflow:hidden; height: 100%; }

#login-screen { padding:32px 20px; display:flex; flex-direction:column; justify-content:center; height:100%; overflow-y:auto; }
.login-logo { width:88px; height:88px; margin:0 auto 20px; border-radius:26px; background:linear-gradient(135deg,#00a884,#008069); display:flex; justify-content:center; align-items:center; font-size:44px; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600; text-transform:uppercase; }
input[type="text"], input[type="password"] { width:100%; padding:14px 16px; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:12px; font-size:16px; outline:none; }
button { width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
.remember-box { display:flex; align-items:center; gap:8px; margin: 15px 0; font-size:14px; color:var(--text-dim); }
.remember-box input { width:18px; height:18px; accent-color:var(--accent); }

#contacts-screen { display:none; flex-direction:column; height:100%; width:100%; }
#contacts-screen.active { display:flex; }
.main-header { padding:16px; background:var(--panel2); display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border); }
.main-header h2 { margin:0; font-size:18px; }
.btn-icon { width:auto; padding:8px 12px; font-size:14px; background:var(--accent); border-radius:8px; }
#contacts-list { flex:1; overflow-y:auto; padding:10px; }

/* Контакт и кнопка удаления */
.contact-item { display:flex; align-items:center; gap:12px; padding:15px; background:var(--panel2); border-radius:12px; margin-bottom:8px; border:1px solid var(--border); }
.contact-main { display:flex; align-items:center; gap:12px; flex:1; cursor:pointer; }
.avatar { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#6C5CE7,#4f6ef7); display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:18px; flex-shrink:0; }
.contact-info { flex:1; }
.contact-name { font-weight:600; font-size:16px; }
.contact-sub { font-size:12px; color:var(--text-dim); }
.btn-delete { width:auto; background:transparent; color:#ff4757; border:none; font-size:20px; padding:10px; cursor:pointer; }

#chat-screen { display:none; flex-direction:column; height:100%; width:100%; position:absolute; inset:0; background:var(--panel); z-index:10; }
#chat-screen.active { display:flex; }
.header { padding:12px; background:var(--panel2); display:flex; align-items:center; gap:12px; border-bottom: 1px solid var(--border); }
.back-btn { background:none; border:none; color:var(--text-dim); width:auto; padding:5px; font-size:24px; }
#messages { flex:1; overflow-y:auto; padding:14px 10px; display:flex; flex-direction:column; gap:6px; background:radial-gradient(circle at 20% 10%,rgba(0,168,132,0.04),transparent 40%); }

.msg-item { max-width:85%; padding:6px 12px 8px; border-radius:12px; font-size:14.5px; line-height:1.35; position:relative; margin-bottom: 2px; }
.msg-item.in { align-self:flex-start; background:var(--bubble-in); border-bottom-left-radius:4px; }
.msg-item.out { align-self:flex-end; background:var(--bubble-out); border-bottom-right-radius:4px; }
.msg-author { font-size:11.5px; font-weight:700; color:var(--accent); margin-bottom:2px; }
.msg-item.out .msg-author { color:#7dd3b6; }
.msg-text { white-space:pre-wrap; word-break:break-word; }
.msg-time { font-size:10.5px; color:rgba(233,237,239,0.55); text-align:right; margin-top:4px; }
.msg-photo { max-width:100%; border-radius:6px; display:block; margin-top:5px; }

.input-area { padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); background:var(--panel2); display:flex; gap:6px; align-items:flex-end; }
.input-wrapper { flex:1; background:var(--panel3); border-radius:22px; display:flex; align-items:center; padding:4px 12px; min-width:0; }
textarea { width:100%; border:none; background:transparent; padding:10px 0; font-size:15px; resize:none; max-height:100px; color:var(--text); outline:none; font-family:inherit; }
.btn-mini { width:42px; height:42px; border-radius:50%; background:transparent; border:none; color:var(--text-dim); display:flex; justify-content:center; align-items:center; padding:0; font-size:20px; }
.btn-send { width:46px; height:46px; border-radius:50%; background:var(--accent); color:#fff; border:none; display:flex; justify-content:center; align-items:center; padding:0; font-size:20px; }

.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center; padding:20px; }
.modal.show { display:flex; }
.modal-content { background:var(--panel2); padding:20px; border-radius:16px; width:100%; max-width:400px; }
.settings-panel { position:absolute; inset:0; background:rgba(11,14,17,0.95); z-index:150; padding:20px; overflow-y:auto; display:none; }
.settings-panel.show { display:block; }
.settings-card { background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:22px; margin-top:20px; }
.toggle { position:relative; width:46px; height:26px; }
.toggle input { display:none; }
.toggle-slider { position:absolute; inset:0; background:#3a4248; border-radius:26px; transition:0.25s; cursor:pointer; }
.toggle-slider::before { content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:0.25s; }
.toggle input:checked + .toggle-slider { background:var(--accent); }
.toggle input:checked + .toggle-slider::before { transform:translateX(20px); }
.settings-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom: 1px solid var(--border); font-size:14px; }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 20px; border-radius:20px; opacity:0; transition:0.3s; z-index:200; text-align:center; }
#toast.show { opacity:1; }
</style>
</head>
<body>

<div class="container">
  <div id="login-screen">
    <div class="login-logo">🔐</div>
    <h2 style="text-align:center;margin-bottom:20px;">Secure Contacts</h2>
    <div class="field"><label>Ваше имя</label><input type="text" id="userName" placeholder="Алиса"></div>
    <div class="field"><label>Сид-фраза (пароль для шифрования)</label><input type="password" id="seedPhrase" placeholder="Пароль"></div>
    <label class="remember-box"><input type="checkbox" id="rememberMe"> Запомнить пароль</label>
    <div class="field"><label>GitHub Token</label><input type="password" id="ghToken" placeholder="ghp_..."></div>
    <button id="loginBtn">Войти</button>
  </div>

  <div id="contacts-screen">
    <div class="main-header">
      <h2>Чаты</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn-icon" id="settingsBtn">⚙️</button>
        <button class="btn-icon" id="addContactBtn">+ Добавить</button>
      </div>
    </div>
    <div id="contacts-list"></div>
  </div>

  <div id="chat-screen">
    <div class="header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="avatar" id="chat-avatar">?</div>
      <div class="contact-info"><div class="contact-name" id="chat-title">Контакт</div></div>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <button class="btn-mini" id="attachBtn">📎</button>
      <div class="input-wrapper"><textarea id="msgInput" placeholder="Сообщение..." rows="1"></textarea></div>
      <button class="btn-send" id="sendBtn">➤</button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-card">
      <h3>Настройки</h3>
      <div class="settings-row"><label>Звук</label><div class="toggle"><input type="checkbox" id="toggleSound"><label class="toggle-slider" for="toggleSound"></label></div></div>
      <div class="settings-row"><label>Вибрация</label><div class="toggle"><input type="checkbox" id="toggleVibrate"><label class="toggle-slider" for="toggleVibrate"></label></div></div>
      <div class="settings-row"><label>Уведомления</label><div class="toggle"><input type="checkbox" id="toggleNotification"><label class="toggle-slider" for="toggleNotification"></label></div></div>
      
      <div class="settings-row" style="flex-direction:column; align-items:stretch; gap:8px; border-bottom:none;">
        <label style="padding:0;">Мелодия</label>
        <button id="pickSoundBtn" style="background:var(--panel3); border:1px solid var(--border); padding:10px; font-size:13px;">Выбрать из файлов</button>
        <span class="value" id="soundName" style="text-align:left; font-size:12px; color:var(--text-dim);">По умолчанию (писк)</span>
        <input type="file" id="soundFileInput" accept="audio/*" style="display:none;">
      </div>

      <div style="margin-top:15px;">
        <label style="font-size:14px; display:block; margin-bottom:8px;">Высота поля ввода:</label>
        <select id="inputHeightSelect" style="width:100%; padding:12px; background:var(--panel3); color:white; border:1px solid var(--border); border-radius:8px;">
          <option value="38">Маленькое</option>
          <option value="70">Среднее</option>
          <option value="120">Большое</option>
        </select>
      </div>

      <button id="closeSettingsBtn" style="background:var(--panel3); margin-top:20px;">Закрыть</button>
      <button id="logoutBtn" style="background:var(--panel3); margin-top:8px;">Выйти</button>
    </div>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Новый контакт</h3>
    <div class="field"><label>Имя контакта</label><input type="text" id="newContactName" placeholder="Вася"></div>
    <button id="createContactBtn" style="margin-bottom:10px;">Создать приглашение</button>
    <button id="joinContactBtn" style="background:var(--panel3);">У меня есть код</button>
    <button id="closeModalBtn" style="background:transparent; color:var(--text-dim); margin-top:10px;">Отмена</button>
  </div>
</div>

<div class="modal" id="inviteModal">
  <div class="modal-content">
    <h3 style="text-align:center;">Код приглашения</h3>
    <p style="text-align:center;font-size:12px;color:var(--text-dim);">Отправьте этот код другу.</p>
    <div style="background:var(--bg); padding:15px; border-radius:8px; text-align:center; font-family:monospace; font-size:14px; word-break:break-all; margin:15px 0;" id="inviteCodeDisplay"></div>
    <button onclick="navigator.clipboard.writeText(document.getElementById('inviteCodeDisplay').innerText); this.innerText='Скопировано!';">Копировать</button>
    <button id="closeInviteBtn" style="background:var(--panel3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="joinModal">
  <div class="modal-content">
    <h3>Введите код</h3>
    <div class="field"><input type="text" id="joinCodeInput" placeholder="Вставьте код здесь..."></div>
    <button id="doJoinBtn">Подключиться</button>
    <button id="closeJoinBtn" style="background:var(--panel3); margin-top:10px;">Отмена</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const state = { user:'', seed:'', token:'', contacts:[], activeChat:null, poll:null, soundData:null, soundCtx:null };
let settings = { sound:true, vibrate:true, notification:false };
let knownIds = new Set();
let isFirstLoad = true; 

const toast = (msg) => { $('toast').innerText = msg; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'), 3000); };
const enc = (text, key) => CryptoJS.AES.encrypt(text, key).toString();
const dec = (cipher, key) => { try { return CryptoJS.AES.decrypt(cipher, key).toString(CryptoJS.enc.Utf8); } catch(e){ return null; } };

// --- ЗВУК ---
function initSound() { if(!state.soundCtx) try{ state.soundCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function playBeep() { initSound(); if(!state.soundCtx)return; try{ let o=state.soundCtx.createOscillator(),g=state.soundCtx.createGain(); o.connect(g); g.connect(state.soundCtx.destination); o.frequency.value=800; g.gain.setValueAtTime(0.1,state.soundCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,state.soundCtx.currentTime+0.2); o.start(); o.stop(state.soundCtx.currentTime+0.2); }catch(e){} }
function playCustom() { if(!state.soundData) return false; try{ new Audio(state.soundData).play(); return true; }catch(e){ return false; } }
function playNotify() { if(!settings.sound)return; if(state.soundData&&playCustom())return; playBeep(); }
function vibrate() { if(settings.vibrate&&navigator.vibrate) navigator.vibrate([100]); }
function showNotify(body) {
  if(!settings.notification || Notification.permission!=='granted' || document.visibilityState==='visible') return;
  try { new Notification('Новое сообщение', { body }); } catch(e){}
}

// --- НАСТРОЙКИ UI ---
$('toggleSound').addEventListener('change', e => { settings.sound = e.target.checked; localStorage.setItem('cc_sound', settings.sound); });
$('toggleVibrate').addEventListener('change', e => { settings.vibrate = e.target.checked; localStorage.setItem('cc_vibrate', settings.vibrate); });
$('toggleNotification').addEventListener('change', e => { 
  settings.notification = e.target.checked; 
  localStorage.setItem('cc_notify', settings.notification);
  if(settings.notification && Notification.permission !== 'granted') Notification.requestPermission(); 
});

$('pickSoundBtn').onclick = () => $('soundFileInput').click();
$('soundFileInput').onchange = e => {
  let f = e.target.files[0]; if(!f) return;
  let reader = new FileReader();
  reader.onload = ev => {
    state.soundData = ev.target.result;
    localStorage.setItem('cc_sound_data', state.soundData);
    localStorage.setItem('cc_sound_name', f.name);
    $('soundName').innerText = f.name;
    toast('Мелодия сохранена');
    setTimeout(()=>playCustom(), 300);
  };
  reader.readAsDataURL(f); e.target.value='';
};

$('inputHeightSelect').addEventListener('change', (e) => {
  $('msgInput').style.height = e.target.value + 'px';
  localStorage.setItem('cc_height', e.target.value);
});

// --- GITHUB API ---
const api = {
  headers: () => ({ 
    'Authorization': `token ${state.token}`, 
    'Content-Type': 'application/json',
    'Accept': 'application/vnd.github.v3+json'
  }),
  createGist: async () => {
    let res = await fetch('https://api.github.com/gists', { 
      method: 'POST', 
      headers: api.headers(), 
      body: JSON.stringify({ description: 'Secure Chat', public: false, files: { 'chat.txt': { content: '' } } }) 
    });
    if(!res.ok) throw new Error('Ошибка создания (проверьте токен)');
    return (await res.json()).id;
  },
  getGist: async (id) => {
    let res = await fetch(`https://api.github.com/gists/${id}?t=${Date.now()}`);
    if(!res.ok) return '';
    let data = await res.json();
    return data.files && data.files['chat.txt'] ? data.files['chat.txt'].content : '';
  },
  updateGist: async (id, content) => {
    let res = await fetch(`https://api.github.com/gists/${id}`, { 
      method: 'PATCH', 
      headers: api.headers(), 
      body: JSON.stringify({ files: { 'chat.txt': { content } } }) 
    });
    if(!res.ok) throw new Error('Нет прав на запись');
  }
};

// --- КОНТАКТЫ ---
function saveContacts() { localStorage.setItem('cc_contacts', JSON.stringify(state.contacts)); }
function loadContacts() {
  state.contacts = JSON.parse(localStorage.getItem('cc_contacts') || '[]');
  renderContacts();
}

function renderContacts() {
  let html = '';
  state.contacts.forEach((c, index) => {
    html += `<div class="contact-item">
      <div class="contact-main" onclick="openChat('${c.id}')">
        <div class="avatar">${c.name.charAt(0).toUpperCase()}</div>
        <div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-sub">Нажмите, чтобы открыть</div></div>
      </div>
      <button class="btn-delete" onclick="event.stopPropagation(); deleteContact(${index})">🗑️</button>
    </div>`;
  });
  $('contacts-list').innerHTML = html || '<p style="text-align:center;color:var(--text-dim);margin-top:40px;">Нет контактов. Нажмите "+ Добавить".</p>';
}

window.deleteContact = function(index) {
  let name = state.contacts[index].name;
  if(confirm('Удалить контакт "' + name + '"?')) {
    state.contacts.splice(index, 1);
    saveContacts();
    renderContacts();
    toast('Контакт удален');
  }
}

async function createContact() {
  let name = $('newContactName').value.trim();
  if(!name) return toast('Введите имя');
  try {
    let newSeed = Math.random().toString(36).substring(2, 12);
    toast('Создаём чат...');
    let gistId = await api.createGist();
    
    await new Promise(r => setTimeout(r, 1500)); 
    
    let inviteCode = btoa(JSON.stringify({ id: gistId, key: newSeed }));
    
    state.contacts.push({ name, id: gistId, key: newSeed });
    saveContacts(); renderContacts();
    
    $('inviteCodeDisplay').innerText = inviteCode;
    $('inviteModal').classList.add('show');
    $('addModal').classList.remove('show');
    $('newContactName').value = '';
    toast('Контакт создан!');
  } catch(e) { toast('Ошибка: ' + e.message); }
}

async function joinContact() {
  let code = $('joinCodeInput').value.trim();
  if(!code) return;
  try {
    let data = JSON.parse(atob(code));
    if(state.contacts.find(c => c.id === data.id)) return toast('Этот контакт уже есть');
    let name = prompt('Введите имя этого контакта:');
    if(!name) return;
    
    state.contacts.push({ name, id: data.id, key: data.key });
    saveContacts(); renderContacts();
    $('joinModal').classList.remove('show');
    $('joinCodeInput').value = '';
    toast('Контакт добавлен!');
  } catch(e) { toast('Неверный код приглашения'); }
}

// --- ЧАТ ---
async function openChat(id) {
  state.activeChat = state.contacts.find(c => c.id === id);
  if(!state.activeChat) return;
  
  $('contacts-screen').classList.remove('active');
  $('chat-screen').classList.add('active');
  $('chat-title').innerText = state.activeChat.name;
  $('chat-avatar').innerText = state.activeChat.name.charAt(0).toUpperCase();
  $('messages').innerHTML = '';
  
  knownIds.clear();
  isFirstLoad = true; 
  
  await loadMessages();
  clearInterval(state.poll);
  state.poll = setInterval(loadMessages, 4000);
}

async function loadMessages() {
  if(!state.activeChat) return;
  try {
    let content = await api.getGist(state.activeChat.id);
    let lines = content.split('\n').filter(l => l.trim() && l !== 'init');
    let html = '';
    
    for(let line of lines) {
      let txt = dec(line, state.activeChat.key);
      if(!txt) continue;
      try {
        let msg = JSON.parse(txt);
        
        if(!knownIds.has(msg.ts)) {
          knownIds.add(msg.ts);
          if(!isFirstLoad && msg.author !== state.user) { 
            playNotify(); vibrate(); showNotify(msg.text || 'Медиа'); 
          }
        }

        let out = msg.author === state.user ? 'out' : 'in';
        let authorHtml = out ? '' : `<div class="msg-author">${msg.author}</div>`;
        
        let time = '--:--';
        if(msg.ts) {
          let d = new Date(msg.ts);
          if(!isNaN(d.getTime())) {
            time = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          }
        }

        let bubble = '';
        if(msg.type === 'text') bubble = `<div class="msg-text">${msg.text}</div>`;
        else if(msg.type === 'photo') bubble = `<img class="msg-photo" src="${msg.data}">`;
        
        html += `<div class="msg-item ${out}">${authorHtml}${bubble}<div class="msg-time">${time}</div></div>`;
      } catch(e) {}
    }
    $('messages').innerHTML = html;
    $('messages').scrollTop = $('messages').scrollHeight;
    isFirstLoad = false; 
  } catch(e) { console.error(e); }
}

// --- ОТПРАВКА ---
async function sendMessage() {
  let text = $('msgInput').value.trim();
  if(!text || !state.activeChat) return;
  
  $('msgInput').disabled = true;
  $('sendBtn').disabled = true;
  $('msgInput').value = ''; 
  
  try {
    let msg = { author: state.user, type: 'text', text, ts: Date.now() };
    let cipher = enc(JSON.stringify(msg), state.activeChat.key);
    
    let current = await api.getGist(state.activeChat.id);
    if(current === 'init') current = '';
    
    let newContent = current ? current + '\n' + cipher : cipher;
    await api.updateGist(state.activeChat.id, newContent);
    
    await loadMessages();
  } catch(e) {
    toast('Ошибка: ' + e.message);
    console.error(e);
  } finally {
    $('msgInput').disabled = false;
    $('sendBtn').disabled = false;
    $('msgInput').focus();
  }
}

// --- СОБЫТИЯ ---
$('loginBtn').onclick = () => {
  state.user = $('userName').value.trim();
  state.seed = $('seedPhrase').value.trim();
  state.token = $('ghToken').value.trim();
  if(!state.user || !state.seed || !state.token) return toast('Заполните все поля');
  
  localStorage.setItem('cc_user', state.user);
  localStorage.setItem('cc_token', state.token);
  if($('rememberMe').checked) localStorage.setItem('cc_seed', state.seed);
  
  $('login-screen').style.display = 'none';
  $('contacts-screen').classList.add('active');
  loadContacts();
};

$('addContactBtn').onclick = () => $('addModal').classList.add('show');
$('closeModalBtn').onclick = () => $('addModal').classList.remove('show');
$('closeInviteBtn').onclick = () => $('inviteModal').classList.remove('show');
$('createContactBtn').onclick = createContact;
$('joinContactBtn').onclick = () => { $('addModal').classList.remove('show'); $('joinModal').classList.add('show'); };
$('closeJoinBtn').onclick = () => $('joinModal').classList.remove('show');
$('doJoinBtn').onclick = joinContact;

$('backBtn').onclick = () => {
  clearInterval(state.poll);
  state.activeChat = null;
  $('chat-screen').classList.remove('active');
  $('contacts-screen').classList.add('active');
};

$('settingsBtn').onclick = () => $('settingsPanel').classList.add('show');
$('closeSettingsBtn').onclick = () => $('settingsPanel').classList.remove('show');
$('logoutBtn').onclick = () => { localStorage.removeItem('cc_seed'); location.reload(); };

$('sendBtn').onclick = sendMessage;
$('attachBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  let f = e.target.files[0]; if(!f || !state.activeChat) return;
  let reader = new FileReader();
  reader.onload = async ev => {
    let msg = { author: state.user, type: 'photo', data: ev.target.result, ts: Date.now() };
    let cipher = enc(JSON.stringify(msg), state.activeChat.key);
    let current = await api.getGist(state.activeChat.id);
    if(current === 'init') current = '';
    let newContent = current ? current + '\n' + cipher : cipher;
    await api.updateGist(state.activeChat.id, newContent);
    loadMessages();
  };
  reader.readAsDataURL(f); e.target.value='';
};

// АВТОВХОД
window.onload = () => {
  if(localStorage.getItem('cc_user')) $('userName').value = localStorage.getItem('cc_user');
  if(localStorage.getItem('cc_token')) $('ghToken').value = localStorage.getItem('cc_token');
  
  if(localStorage.getItem('cc_sound') !== null) { settings.sound = localStorage.getItem('cc_sound')==='true'; $('toggleSound').checked = settings.sound; }
  if(localStorage.getItem('cc_vibrate') !== null) { settings.vibrate = localStorage.getItem('cc_vibrate')==='true'; $('toggleVibrate').checked = settings.vibrate; }
  if(localStorage.getItem('cc_notify') !== null) { settings.notification = localStorage.getItem('cc_notify')==='true'; $('toggleNotification').checked = settings.notification; }
  if(localStorage.getItem('cc_sound_data')) { state.soundData = localStorage.getItem('cc_sound_data'); $('soundName').innerText = localStorage.getItem('cc_sound_name') || 'Своя мелодия'; }
  if(localStorage.getItem('cc_height')) { $('inputHeightSelect').value = localStorage.getItem('cc_height'); $('msgInput').style.height = localStorage.getItem('cc_height')+'px'; }

  if(localStorage.getItem('cc_seed')) {
    $('seedPhrase').value = localStorage.getItem('cc_seed');
    $('rememberMe').checked = true;
    $('loginBtn').click();
  }
};
</script>
</body>
</html>
